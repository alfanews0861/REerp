name: Android Release APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch Expo Modules for Android API 36 Compatibility
        run: |
          echo "Patching PermissionsService.kt for Android API 36 nullability..."
          find node_modules -name "PermissionsService.kt" -exec sed -i 's/return requestedPermissions\.contains(permission)/return requestedPermissions?.contains(permission) == true/g' {} +
          find node_modules -name "PermissionsService.kt" -exec grep -n "requestedPermissions" {} +

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Setup API 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" || true

      - name: Verify Keystore File
        working-directory: apps/marketing-mobile/android/app
        run: |
          if [ ! -f "release.keystore" ]; then
            echo "::error::release.keystore not found in apps/marketing-mobile/android/app!"
            exit 1
          fi
          echo "release.keystore exists. Size:"
          ls -lh release.keystore

      - name: Make gradlew executable
        working-directory: apps/marketing-mobile/android
        run: chmod +x gradlew

      - name: Build Android Release APK (API 36 Play Store Compliant)
        working-directory: apps/marketing-mobile/android
        run: ./gradlew assembleRelease --stacktrace
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Locate and Verify Release APK
        run: |
          echo "=== Generated APK files ==="
          find apps/marketing-mobile/android/app/build/outputs/apk -name "*.apk" -ls
          RELEASE_APK=$(find apps/marketing-mobile/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "::error::Release APK not found in outputs directory!"
            exit 1
          fi
          echo "✅ Release APK found at: $RELEASE_APK"
          ls -lh "$RELEASE_APK"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealEstateERP-V1-release-apk
          path: apps/marketing-mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "## RealEstateERP V1 Android Release Build" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "**Status:** ✅ PASS" >> $GITHUB_STEP_SUMMARY
            echo "**APK:** Generated Signed Release APK (JNI Stable)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ FAIL" >> $GITHUB_STEP_SUMMARY
            echo "**APK:** Not Generated" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Node:** 24.x" >> $GITHUB_STEP_SUMMARY
          echo "**Java:** 17" >> $GITHUB_STEP_SUMMARY
          echo "**Compile/Target SDK:** API Level 36 (Android 16 - Play Store Compliant)" >> $GITHUB_STEP_SUMMARY
          echo "**R8 Compression:** Disabled (JNI Stable)" >> $GITHUB_STEP_SUMMARY
          echo "**Functions Runtime:** Firebase Functions V2 (Node 24)" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** com.realestateerp.marketingmobile" >> $GITHUB_STEP_SUMMARY
