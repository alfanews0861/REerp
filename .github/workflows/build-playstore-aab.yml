name: Android Play Store AAB Bundle Build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version Code for Play Store (e.g. 1, 2, 3)'
        required: false
        default: '1'
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-aab:
    name: Build Play Store AAB (Android App Bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch Expo Modules & React Native Screens for Android API 36 Compatibility
        run: |
          echo "Patching PermissionsService.kt for Android API 36 nullability..."
          find node_modules -name "PermissionsService.kt" -exec sed -i 's/return requestedPermissions\.contains(permission)/return requestedPermissions?.contains(permission) == true/g' {} +
          find node_modules -name "PermissionsService.kt" -exec grep -n "requestedPermissions" {} +
          echo "Patching ScreenStack.kt for Android API < 35 NoSuchMethodError removeLast compatibility..."
          find node_modules -name "ScreenStack.kt" -exec sed -i 's/drawingOpPool\.removeLast()/drawingOpPool.removeAt(drawingOpPool.size - 1)/g' {} +
          find node_modules -name "ScreenStack.kt" -exec grep -n "drawingOpPool.remove" {} +

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Setup API 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" || true

      - name: Verify Keystore File
        working-directory: apps/marketing-mobile/android/app
        run: |
          if [ ! -f "release.keystore" ]; then
            echo "::error::release.keystore not found in apps/marketing-mobile/android/app!"
            exit 1
          fi
          echo "release.keystore exists. Size:"
          ls -lh release.keystore

      - name: Make gradlew executable
        working-directory: apps/marketing-mobile/android
        run: chmod +x gradlew

      - name: Build Play Store AAB Bundle (API 36 Compliant)
        working-directory: apps/marketing-mobile/android
        run: |
          VERSION_CODE="${{ inputs.version_code }}"
          VERSION_CODE="${VERSION_CODE:-1}"
          VERSION_NAME="${{ inputs.version_name }}"
          VERSION_NAME="${VERSION_NAME:-1.0.0}"
          echo "Building Play Store AAB Bundle with versionCode: $VERSION_CODE, versionName: $VERSION_NAME"
          ./gradlew bundleRelease -Pandroid.versionCode="$VERSION_CODE" -Pandroid.versionName="$VERSION_NAME" --stacktrace
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Locate and Verify Play Store Release AAB
        run: |
          echo "=== Generated AAB (Android App Bundle) files ==="
          find apps/marketing-mobile/android/app/build/outputs/bundle -name "*.aab" -ls
          RELEASE_AAB=$(find apps/marketing-mobile/android/app/build/outputs/bundle -name "*release*.aab" | head -n 1)
          if [ -z "$RELEASE_AAB" ]; then
            echo "::error::Release AAB (Play Store Android App Bundle) not found in outputs directory!"
            exit 1
          fi
          echo "✅ Play Store Release AAB found at: $RELEASE_AAB"
          ls -lh "$RELEASE_AAB"
          echo "=== Verifying Play Store AAB Signature ==="
          jarsigner -verify "$RELEASE_AAB" || true

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealEstateERP-V1-playstore-aab
          path: apps/marketing-mobile/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "## RealEstateERP V1 Play Store AAB Build" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "**Status:** ✅ PASS" >> $GITHUB_STEP_SUMMARY
            echo "**AAB:** Generated Play Store Compliant Release AAB (Google Play Console Ready)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ FAIL" >> $GITHUB_STEP_SUMMARY
            echo "**Artifact:** Build Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version Code:** ${{ inputs.version_code || '1' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version Name:** ${{ inputs.version_name || '1.0.0' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Node:** 24.x" >> $GITHUB_STEP_SUMMARY
          echo "**Java:** 17" >> $GITHUB_STEP_SUMMARY
          echo "**Compile/Target SDK:** API Level 36 (Android 16 - Play Store Compliant)" >> $GITHUB_STEP_SUMMARY
          echo "**Keystore:** release.keystore (realestate-release-key, Valid until 2054)" >> $GITHUB_STEP_SUMMARY
          echo "**R8 Compression:** Disabled (JNI Stable)" >> $GITHUB_STEP_SUMMARY
          echo "**Functions Runtime:** Firebase Functions V2 (Node 24)" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** com.realestateerp.marketingmobile" >> $GITHUB_STEP_SUMMARY
